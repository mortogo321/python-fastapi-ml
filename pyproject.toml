[project]
name = "python-fastapi-ml"
version = "1.1.0"
description = "FastAPI RAG service - local LLM via Ollama, PostgreSQL/pgvector semantic search"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "mortogo321" }]
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "psycopg2-binary==2.9.13",
  "sqlalchemy[asyncio]==2.1.1",
  "pgvector==0.5.0",
  "asyncpg==0.31.0",
  "ollama==0.6.3",
  "numpy==2.5.3",
  "sentence-transformers==6.1.0",
  "python-dotenv==1.2.3",
  "httpx==0.28.1",
  "tenacity==9.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff==0.17.0",
  "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ASYNC", "S", "A"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = false
show_error_codes = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "ollama.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
