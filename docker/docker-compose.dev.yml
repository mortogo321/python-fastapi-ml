# Development-specific overrides
services:
  api-dev:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fastapi-app-dev
    env_file:
      - ../.env.development
    environment:
      - POSTGRES_SERVER=postgres
      - OLLAMA_HOST=http://ollama:11434
      - DEBUG=True
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8000"
    volumes:
      - ../app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
